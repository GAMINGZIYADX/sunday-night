Congrats on finishing my cute little game. I made you something again, because the words in my head never land right, and this is the only way I know how to make them land.

I carried my pain so long I forgot what my hands were for.
Then you showed up, and I finally had something to hold that wasn't heavy.

I used to sit in front of a wall and wait for the days to be over.
Now I wait for Sunday. I wait for your messages. I wait for the sound you make when you laugh.

Because of you I feel better. Not fixed. Better.
I laugh without checking if I'm allowed to.
The noise in my head is quieter when you're in it.

I'm not the easy one. You know that.
Your eyes make me lose every argument I never had.

e number of steps. Nothing says how many. The wheel poster turns to try them.","Look at the one-letter word: in English it can only be I or A. That tells you the step.","{LONE} is {LONEPLAIN}, so every letter moved {SHIFT} steps forward. Moving them back reads: {SENTENCE}. The fridge wants the last word, {WORD}."],r3b:["The recipe card on the wall is a little riddle for the four oven dials.","The first dial is the last one doubled, so try the last dial small: 1, 2, 3 or 4. The second must be bigger than all the others.","Set the dials to {DIALS}. Click a dial to turn it up, right-click to turn it down."],r4a:["Tchobin and Zizo are hiding somewhere in the study. They hear you looking in the wrong place and sneak somewhere new, so do not guess. Stand still and listen.","Turn slowly until the meow sounds straight ahead, and look low: a tail tip or a pair of ears gives them away.","{SPOTS}"],r4b:["The chalkboard holds a 6×6 sudoku. Every row, column and box (two rows by three columns) needs 1 to 6 exactly once.","Look for a number that can only go in one place inside a box, or a cell that can only hold one number. Each answer opens up the next.","{SUDOKU}"],r5a:["The gate lock wants four digits. The note on the gate says to remember what each room gave you.","Every door you opened made a memory tulip glow and gave you a digit. Open your journal with Tab.","Enter the digits in room order: {CODE}."],r5b:["The card on the telescope says a year of us. The lettered stars are the months, by their first letters.","January, February, March... Letters repeat, and some stars are not part of it. Each month sits right next to the one before it, so follow the shape.","Start at the J at the bottom point of the heart, next to the F. Go up the left side: J F M A M J, over the top: J A S O N D. Wrong stars just fade."]},Ns={r1a:"The three frames",r1b:"The fallen painting",r2a:"The vase stand",r2b:"The rainbow books",r3a:"The secret word",r3b:"The oven dials",r4a:"Hide and seek",r4b:"The
