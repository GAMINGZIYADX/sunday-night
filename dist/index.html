I used to care. I used to try.
Then there was a stranger. Then there wasn't.`,`Blue and white.
I can't see them anymore without seeing you.

Now it's the day my chest stops being heavy.
I count down to it.`,`I used to think I was a wildfire in an iced biome, and the snow was slowly killing the fire.
Then you sat next to me.

Congrats on finishing my cute little game. I made you something again, because the words in my head never land right, and this is the only way I know how to make them land.

I carried my pain so long I forgot what my hands were for.
Then you showed up, and I finally had something to hold that wasn't heavy.

I used to sit in front of a wall and wait for the days to be over.
Now I wait for Sunday. I wait for your messages. I wait for the sound you make when you laugh.

Because of you I feel better. Not fixed. Better.
I laugh without checking if I'm allowed to.
The noise in my head is quieter when you're in it.

I'm not the easy one. You know that.
Your eyes make me lose every argument I never had.
Your smile feels like warm blood coming back into a frozen hand.

I love you more than you can imagine.

One star for every month.`},recipe:{title:"Recipe card",text:sc},gate:{title:"A note on the gate",text:"Remember what each room gave you."}},Bd={r1a:["The little card by the nightstand lamp tells the story. Look closely at two things in every frame.","The gap between the tulips leaves ties, and so do the seasons. Use both: the year runs winter, spring, summer, autumn, and back to winter.","Left to right: snowy and far apart, spring blossom and far apart, summer sun and closer, autumn leaves and closer, snowy and together. Click one frame, then another, to swap them."],r1b:["The tulip painting fell off the wall in sixteen pieces. They are on the floor by the window.","Use Peek to see the whole picture, and Numbers to see where each piece belongs. Finish the top row, then the second row, and only then the last two rows together.","Place 1 and 2, then slide 3 and 4 in as a pair (4 above 3 first, then turn them in). Do the same for each row. The last two rows: fix the left column a pair at a time, then cycle the final pieces. Gentle shuffle gives an easier start."],r2a:["The rug in front of the sofa shows how the tulips began. The faded note says each time, a little more.","Count the colours in runs: one blue, one white, then two blue, two white. Keep the rule going and the planted vases will agree with you.","All twelve, left to right: {ANSWER}."],r2b:["The coloured window above the bookshelf knows the right order. But the shelf is tight: a book only moves by turning with its two neighbours.","Click a book to turn it with the ones either side (right-click turns the other way). One turn moves a book two places; two turns of the same three swap two books around the third.","Red, orange, yellow, green, blue, indigo, violet, pink. Work from the left: bring red to the first place by turning triples it sits in, then never touch it again. Then orange, and so on. The last few fall in with a turn or two."],r3a:["The pinned card is a sentence where every letter was moved the sam
